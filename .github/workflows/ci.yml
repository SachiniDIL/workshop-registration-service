name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        # tsc depends on Next's generated LayoutProps/PageProps types (.next/types/),
        # which only exist after `next build` or `next dev` have run. `next typegen`
        # produces them without a full build, and needs no env vars to do so.
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
